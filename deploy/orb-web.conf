[program:orb-web]
; Nuxt 4 / Nitro SSR server. Was run by pm2 until the move to Drone CI; supervisor
; now owns it so both Orb processes have one process manager.
;
; The interpreter path is the nvm node that pm2 used. It lives under /root, so this
; program must keep running as root (supervisor's default) or node becomes unreadable.
; The .env that remote-deploy.sh installs into /var/www/orb is sourced here,
; because Nitro's production server does NOT read .env files - that is a dev and
; build-time convenience only. Without this line the process runs on the
; defaults compiled in from nuxt.config.ts, and `nuxt build` does not bake .env
; into the output either, so Consul's config reached nothing at all.
;
; That is how production served every browser wsBase="ws://localhost:8080/ws"
; for three months: the socket pointed at the visitor's own machine and was
; blocked as mixed content besides, so realtime never connected once. apiBase
; was equally unset and nobody noticed, because its default (localhost:8080)
; happens to be where orb-api really does listen on this box.
command=/bin/bash -c 'set -a; [ -f /var/www/orb/.env ] && . /var/www/orb/.env; set +a; exec /root/.nvm/versions/node/v20.20.0/bin/node /var/www/orb/server/index.mjs'
directory=/var/www/orb
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
; HOST pins Nitro to loopback. pm2 left it on 0.0.0.0, which - with no firewall on
; this box - published the SSR server straight to the internet on :3000, bypassing
; nginx and TLS. nginx proxies to 127.0.0.1:3000, so loopback is all it needs.
environment=NODE_ENV="production",HOST="127.0.0.1",PORT="3000"
stdout_logfile=/var/log/supervisor/orb-web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/orb-web-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
