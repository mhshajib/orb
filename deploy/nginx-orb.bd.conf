server {
    listen 80;
    listen [::]:80;
    server_name orb.bd www.orb.bd;
    return 301 https://orb.bd$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orb.bd www.orb.bd;

    ssl_certificate     /etc/letsencrypt/live/orb.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orb.bd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/orb.bd.access.log;
    error_log  /var/log/nginx/orb.bd.error.log;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
